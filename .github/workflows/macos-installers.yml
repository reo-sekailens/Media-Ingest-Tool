name: macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: DMG (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-13
            target: x86_64-apple-darwin
            artifact: media-ingest-tool-macos-intel-dmg
          - name: Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: media-ingest-tool-macos-apple-silicon-dmg
    env:
      # Ad-hoc signing prevents the damaged-app failure common on downloaded
      # Apple Silicon artifacts. It is deliberately not notarization.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build direct-download DMG
        run: npm run tauri build -- --bundles dmg --target ${{ matrix.target }}
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
