name: Nightly packages

on:
  schedule:
    # 02:17 Asia/Singapore (18:17 UTC), away from the hourly queue peak.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-packages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-ref: ${{ steps.metadata.outputs.source-ref }}
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: metadata
        run: node scripts/release-metadata.mjs resolve nightly

  quality:
    needs: snapshot
    uses: ./.github/workflows/ci.yml
    with:
      source-ref: ${{ needs.snapshot.outputs.source-ref }}
      check-only: true

  packages:
    needs: snapshot
    uses: ./.github/workflows/packages.yml
    with:
      source-ref: ${{ needs.snapshot.outputs.source-ref }}

  publish:
    needs: [snapshot, quality, packages]
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      source-ref: ${{ needs.snapshot.outputs.source-ref }}
      tag: ${{ needs.snapshot.outputs.tag }}
      title: ${{ needs.snapshot.outputs.title }}
      channel: nightly
      prerelease: true
