name: Quality

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      check-only:
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Test packaging and release safeguards
        run: node --test scripts/*.test.mjs
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Activate repository Rust toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: quality-${{ matrix.os }}
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential curl file libayatana-appindicator3-dev libgtk-3-dev
          libdbus-1-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev
          libxdo-dev wget
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  macos-package:
    name: macOS unsigned package
    needs: [frontend, rust]
    if: ${{ !inputs.check-only }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Activate repository Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-smoke-package
      - run: npm ci
      - run: npm run tauri build -- --ci --bundles app,dmg -- --locked
      - name: Record DMG checksums and source provenance
        run: node scripts/write-dmg-manifest.mjs src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-bundle
          path: src-tauri/target/release/bundle
          if-no-files-found: error
